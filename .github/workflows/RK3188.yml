name: Build U-Boot for RK3188 (Manual with .config tweak)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget \
            python3 \
            python3-pyelftools

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin (for potential binaries)
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Configure, tweak config, and build U-Boot
        run: |
          cd u-boot
          # 1. 配置为 Radxa Rock (RK3188)
          make rock_defconfig CROSS_COMPILE=arm-linux-gnueabihf-
          # 2. 修正架构为 ARMv7 (Cortex-A9)
          sed -i 's/CONFIG_ARM_ARCH=5/CONFIG_ARM_ARCH=7/' .config
          # 确保启用 CPU_V7
          echo "CONFIG_CPU_V7=y" >> .config
          # 3. 编译，强制覆盖 CFLAGS 和 KCFLAGS
          make CROSS_COMPILE=arm-linux-gnueabihf- \
               KCFLAGS="-march=armv7-a -Wno-error" \
               KBUILD_CFLAGS="-march=armv7-a -Wno-error" \
               -j$(nproc)
          # 4. 打包为 Rockchip 格式的 uboot.img
          tools/mkimage -n rk3188 -T rksd -d spl/u-boot-spl.bin u-boot.img
          cat u-boot.bin >> u-boot.img

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          cp u-boot/u-boot.img uboot-output/
          cp u-boot/spl/u-boot-spl.bin uboot-output/ 2>/dev/null || true
          cp u-boot/u-boot.bin uboot-output/ 2>/dev/null || true
          # 生成 parameter.txt 示例
          cat > uboot-output/parameter.txt << EOF
          FIRMWARE_VER:1.0.0
          MACHINE_MODEL:rk3188
          MACHINE_ID:007
          MANUFACTURER: Rockchip
          MAGIC: 0x5041524B
          ATAG: 0x60000800
          MACHINE: 3188
          CHECK_MASK: 0x80
          PWR_HLD: 0,0,A,0,1
          CMDLINE:console=ttyFIQ0,115200 earlyprintk root=/dev/mmcblk0p2 rootfstype=ext4 rootwait
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-manual
          path: uboot-output/
