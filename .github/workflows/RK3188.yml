name: Build RK3188 U-Boot for RKDevTool

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            swig python3-dev \
            bison flex

      - name: Checkout Rockchip U-Boot
        uses: actions/checkout@v4
        with:
          repository: rockchip-linux/u-boot
          ref: master
          submodules: recursive

      - name: Copy Custom DTS
        run: |
          # 从仓库根目录复制DTS
          cp $GITHUB_WORKSPACE/rk3188-sangfor-adesk.dts arch/arm/dts/rk3188-sangfor-adesk.dts
          
          # 在Makefile中添加DTB目标
          echo "" >> arch/arm/dts/Makefile
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-sangfor-adesk.dtb" >> arch/arm/dts/Makefile
          
          # 处理defconfig（若无rk3188_defconfig则创建）
          if [ ! -f configs/rk3188_defconfig ]; then
            cp configs/rock_defconfig configs/rk3188_defconfig
          fi
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE="rk3188-radxarock"/CONFIG_DEFAULT_DEVICE_TREE="rk3188-sangfor-adesk"/g' configs/rk3188_defconfig

      - name: Build U-Boot
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          
          make clean
          make rk3188_defconfig
          make -j$(nproc)
          
          # 尝试生成uboot.img（若boot_merger存在）
          if [ -f tools/boot_merger ]; then
            # 创建简单的RK3188MINIALL.ini
            cat > /tmp/RK3188MINIALL.ini << 'EOF'
[CHIP_NAME]
NAME=RK3188

[VERSION]
MAJOR=2
MINOR=3

[CODE471_OPTION]
NUM=1
Path1=u-boot-dtb.bin
Sleep=0

[CODE472_OPTION]
NUM=1
Path1=u-boot-dtb.bin
Sleep=0

[LOADER_OPTION]
NUM=2
LOADER1=u-boot-spl.bin
LOADER2=u-boot.bin
FlashData=0x60000000
FlashBoot=0x60000000

[OUTPUT]
NAME=uboot.img
EOF
            ./tools/boot_merger /tmp/RK3188MINIALL.ini
          fi
          
          ls -la uboot.img u-boot.bin u-boot-rockchip.bin spl/u-boot-spl.bin 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-package
          path: |
            uboot.img
            u-boot.bin
            u-boot-rockchip.bin
            spl/u-boot-spl.bin
          if-no-files-found: warn
