name: Build RK3188 U-Boot for RKDevTool

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 安装必要的构建工具和依赖
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            swig python3-dev \
            bison flex

      # Step 2: 拉取 Rockchip 官方 U-Boot 仓库（包含 boot_merger 和打包脚本）
      # 注意：官方仓库可能包含特定的分支和补丁，需确保其支持 RK3188
      - name: Checkout Rockchip U-Boot
        uses: actions/checkout@v4
        with:
          repository: rockchip-linux/u-boot
          ref: master # 如果有针对RK3188的稳定分支，建议替换
          submodules: recursive

      # Step 3: 写入自定义 DTS 并修改配置
      - name: Customize DTS
        run: |
          # 创建 U-Boot 专用的精简版 DTS
          cat > arch/arm/dts/rk3188-sangfor-adesk.dts << 'EOF'
          /dts-v1/;
          #include "rk3188.dtsi"
          / {
              model = "Sangfor aDesk VDI (RK3188-PX3)";
              compatible = "sangfor,adesk-vdi", "rockchip,rk3188";
              chosen {
                  stdout-path = "serial0:115200n8";
                  bootargs = "console=ttyFIQ0,115200 earlycon=uart8250,mmio32,0x20064000,115200 root=/dev/mmcblk0p2 rootfstype=ext4 rootwait";
              };
              memory@60000000 { device_type = "memory"; reg = <0x60000000 0x40000000>; };
              aliases { serial0 = &uart0; mmc0 = &emmc; };
              vcc_sys: vsys-regulator {
                  compatible = "regulator-fixed"; regulator-name = "vcc_sys";
                  regulator-min-microvolt = <5000000>; regulator-max-microvolt = <5000000>;
                  regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc;
              };
              vcc_io: vcc-io-regulator {
                  compatible = "regulator-fixed"; regulator-name = "vcc_io";
                  regulator-min-microvolt = <3300000>; regulator-max-microvolt = <3300000>;
                  regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc;
                  vin-supply = <&vcc_sys>;
              };
              vccq_emmc: emmc-vccq-regulator {
                  compatible = "regulator-fixed"; regulator-name = "vccq_emmc";
                  regulator-min-microvolt = <1800000>; regulator-max-microvolt = <1800000>;
                  u-boot,dm-pre-reloc; vin-supply = <&vcc_sys>;
              };
          };
          &uart0 { status = "okay"; u-boot,dm-pre-reloc; pinctrl-0 = <&uart0_xfer>; pinctrl-names = "default"; };
          &emmc { status = "okay"; u-boot,dm-pre-reloc; bus-width = <8>; cap-mmc-highspeed; non-removable; vmmc-supply = <&vcc_io>; vqmmc-supply = <&vccq_emmc>; };
          &i2c1 {
              status = "okay"; clock-frequency = <400000>; u-boot,dm-pre-reloc;
              rk808: pmic@1b {
                  compatible = "rockchip,rk808"; reg = <0x1b>;
                  interrupt-parent = <&gpio0>; interrupts = <RK_PB3 IRQ_TYPE_LEVEL_LOW>;
                  u-boot,dm-pre-reloc; rockchip,system-power-controller; wakeup-source;
                  regulators {
                      vdd_cpu: DCDC_REG1 { regulator-name = "vdd_cpu"; regulator-min-microvolt = <750000>; regulator-max-microvolt = <1350000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vdd_core: DCDC_REG2 { regulator-name = "vdd_core"; regulator-min-microvolt = <850000>; regulator-max-microvolt = <1250000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vcc_ddr: DCDC_REG3 { regulator-name = "vcc_ddr"; regulator-min-microvolt = <1200000>; regulator-max-microvolt = <1200000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      DCDC_REG4 { regulator-name = "vcc_io"; regulator-min-microvolt = <3300000>; regulator-max-microvolt = <3300000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vcc_lan: LDO_REG1 { regulator-name = "vcc_lan"; regulator-min-microvolt = <3300000>; regulator-max-microvolt = <3300000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vdd_10: LDO_REG3 { regulator-name = "vdd_10"; regulator-min-microvolt = <1000000>; regulator-max-microvolt = <1000000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                  };
              };
          };
          EOF
          # 将DTS加入构建列表
          echo "" >> arch/arm/dts/Makefile
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-sangfor-adesk.dtb" >> arch/arm/dts/Makefile

      # Step 4: 编译 U-Boot (必须使用官方 make.sh 以支持后续打包)
      - name: Build U-Boot
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          # 针对RK3188进行构建
          # 注意：官方SDK可能默认使用 rk3188_defconfig，若无则用 rock_defconfig 并确保 DTB 修改生效
          make rk3188_defconfig 2>/dev/null || make rock_defconfig
          
          # 编译并打包 (make.sh 会处理后续的 boot_merger 步骤)
          # 如果 make.sh 不可用或报错，需手动执行：
          # ./tools/boot_merger ./tools/rk_tools/RKBOOT/RK3188MINIALL.ini
          ./make.sh rk3188

      # Step 5: 上传可直接由 RKDevTool 识别的产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-official-package
          path: |
            uboot.img
            RK3188Loader_miniall.bin
            u-boot-rockchip.bin
          if-no-files-found: warn
