name: Build U-Boot for RK3188

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin repository
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Create fake toolchain directory with symlinks
        run: |
          # 创建脚本期望的目录
          mkdir -p prebuilts/gcc/linux-x86/arm/gcc-linaro-6.3.1-2017.05-x86_64_arm-linux-gnueabihf/bin
          cd prebuilts/gcc/linux-x86/arm/gcc-linaro-6.3.1-2017.05-x86_64_arm-linux-gnueabihf/bin
          # 将系统工具链软链接到该目录
          for tool in /usr/bin/arm-linux-gnueabihf-*; do
            ln -sf $tool .
          done
          # 确保 arm-linux-gnueabihf-gcc 存在
          ln -sf /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc 2>/dev/null || true

      - name: Build U-Boot for RK3188
        run: |
          cd u-boot
          export RKBIN_DIR=$PWD/../rkbin
          # 此处不再需要设置 GCC_PATH，因为 make.sh 将使用我们创建的路径
          ./make.sh rock

      - name: List generated files
        run: |
          echo "Generated files in u-boot/:"
          ls -l u-boot/*.bin u-boot/*.img 2>/dev/null || echo "No files in root"
          echo "Checking rockdev/ directory:"
          ls -l u-boot/rockdev/ 2>/dev/null || echo "No rockdev directory"

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          cp u-boot/*_loader_*.bin uboot-output/ 2>/dev/null || echo "No loader bin"
          cp u-boot/uboot.img uboot-output/ 2>/dev/null || echo "No uboot.img"
          cp u-boot/trust.img uboot-output/ 2>/dev/null || echo "No trust.img"
          cp u-boot/rockdev/*.img uboot-output/ 2>/dev/null || echo "No rockdev images"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot
          path: uboot-output/
