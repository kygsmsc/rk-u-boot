name: Build RK3188 U-Boot for RKDevTool

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            swig python3-dev \
            bison flex

      - name: Clone Rockchip U-Boot
        run: |
          git clone https://github.com/rockchip-linux/u-boot.git u-boot
          cd u-boot
          git submodule update --init --recursive

      - name: Setup DTS and Config
        run: |
          cd u-boot
          cp "$GITHUB_WORKSPACE/rk3188-sangfor-adesk.dts" arch/arm/dts/rk3188-sangfor-adesk.dts
          echo "" >> arch/arm/dts/Makefile
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-sangfor-adesk.dtb" >> arch/arm/dts/Makefile
          if [ ! -f configs/rk3188_defconfig ]; then
            cp configs/rock_defconfig configs/rk3188_defconfig
          fi
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE="rk3188-radxarock"/CONFIG_DEFAULT_DEVICE_TREE="rk3188-sangfor-adesk"/g' configs/rk3188_defconfig

      - name: Build U-Boot
        run: |
          cd u-boot
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"
          export PATH=$PATH:$PWD/tools

          make clean
          make rk3188_defconfig

          # 裁剪不需要的组件，禁用警告即错误
          sed -i 's/^CONFIG_SPL_PINCTRL=y/# CONFIG_SPL_PINCTRL is not set/g' .config
          sed -i 's/^CONFIG_SPL_OF_PLATDATA=y/# CONFIG_SPL_OF_PLATDATA is not set/g' .config
          sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/g' .config
          echo "/* dummy file */" > drivers/serial/serial_rockchip.c

          # 移除大小限制导致的报错
          sed -i '/limit = /d' scripts/Makefile.spl
          sed -i '/printf "%d"/d' scripts/Makefile.spl
          sed -i 's/^CONFIG_SPL_SIZE_LIMIT=.*/CONFIG_SPL_SIZE_LIMIT=0/g' .config

          # 【核心修复】强制开启 RK3188 启动所需的 TPL 支持
          # 移除所有对 CONFIG_TPL 的禁用，并确保关键配置存在
          sed -i 's/^# CONFIG_TPL is not set/CONFIG_TPL=y/g' .config
          sed -i 's/^# CONFIG_ROCKCHIP_BROM_HELPER is not set/CONFIG_ROCKCHIP_BROM_HELPER=y/g' .config
          sed -i 's/^# CONFIG_ROCKCHIP_SPL_BACK_TO_BROM is not set/CONFIG_ROCKCHIP_SPL_BACK_TO_BROM=y/g' .config
          sed -i 's/^# CONFIG_TPL_ROCKCHIP_BACK_TO_BROM is not set/CONFIG_TPL_ROCKCHIP_BACK_TO_BROM=y/g' .config
          sed -i 's/^# CONFIG_TPL_SERIAL_SUPPORT is not set/CONFIG_TPL_SERIAL_SUPPORT=y/g' .config
          sed -i 's/^# CONFIG_TPL_LIBCOMMON_SUPPORT is not set/CONFIG_TPL_LIBCOMMON_SUPPORT=y/g' .config
          sed -i 's/^# CONFIG_TPL_LIBGENERIC_SUPPORT is not set/CONFIG_TPL_LIBGENERIC_SUPPORT=y/g' .config

          # 强制禁用 TPL 大小限制（防止 TPL 超过 1KB 限制）
          sed -i 's/^CONFIG_TPL_SIZE_LIMIT=.*/CONFIG_TPL_SIZE_LIMIT=0/g' .config

          make olddefconfig

          # 再次确认 TPL 已开启，并确保限制为 0
          sed -i 's/^CONFIG_TPL=y/CONFIG_TPL=y/g' .config
          sed -i 's/^CONFIG_SPL_SIZE_LIMIT=.*/CONFIG_SPL_SIZE_LIMIT=0/g' .config
          sed -i 's/^CONFIG_TPL_SIZE_LIMIT=.*/CONFIG_TPL_SIZE_LIMIT=0/g' .config

          # 【关键】使用 -j2 并行编译，防止因依赖缺失跳步导致 TPL 未生成
          make -j2

          echo "================ 检查 TPL 和 SPL 是否生成 ================"
          ls -la tpl/u-boot-tpl.bin spl/u-boot-spl.bin u-boot.bin u-boot-dtb.bin 2>/dev/null || true
          if [ ! -f tpl/u-boot-tpl.bin ]; then
            echo "Error: TPL 未生成！请检查 .config 中 CONFIG_TPL=y 是否生效。"
            exit 1
          fi

      - name: Package U-Boot
        run: |
          cd u-boot
          echo "开始打包..."
          if [ ! -f tools/boot_merger ]; then
            wget -O tools/boot_merger https://raw.githubusercontent.com/rockchip-linux/rkbin/master/tools/boot_merger || true
            chmod +x tools/boot_merger 2>/dev/null || true
          fi

          if [ -f tools/boot_merger ] && [ -f tpl/u-boot-tpl.bin ]; then
            echo "使用 boot_merger 打包"
            cat tpl/u-boot-tpl.bin > tplspl.bin
            truncate -s 1020 tplspl.bin
            printf 'RK31' | dd of=tplspl.bin bs=1 count=4 conv=notrunc
            cat spl/u-boot-spl.bin >> tplspl.bin
            truncate -s 2048 tplspl.bin

            printf '[CHIP_NAME]\nNAME=RK31\n[VERSION]\nMAJOR=2\nMINOR=3\n[CODE471_OPTION]\nNUM=1\nPath1=tplspl.bin\nSleep=0\n[CODE472_OPTION]\nNUM=1\nPath1=u-boot-dtb.bin\nSleep=0\n[LOADER_OPTION]\nNUM=2\nLOADER1=FlashData\nLOADER2=FlashBoot\nFlashData=tplspl.bin\nFlashBoot=u-boot-dtb.bin\n[OUTPUT]\nPATH=RK3188Loader_miniall.bin\n' > /tmp/RK3188MINIALL.ini

            ./tools/boot_merger --rc4 /tmp/RK3188MINIALL.ini
            echo "RK3188Loader_miniall.bin 生成成功"
          else
            echo "打包失败：缺少 tpl/u-boot-tpl.bin 或 boot_merger 工具"
            exit 1
          fi

          if [ -f u-boot-dtb.bin ]; then
            ./tools/mkimage -n rk3188 -T rksd -d u-boot-dtb.bin uboot.img
            echo "uboot.img 生成成功"
          else
            echo "u-boot-dtb.bin 不存在，无法生成 uboot.img"
          fi

          echo "最终产物列表："
          ls -la RK3188Loader_miniall.bin uboot.img u-boot.bin 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-package
          path: |
            u-boot/RK3188Loader_miniall.bin
            u-boot/uboot.img
            u-boot/u-boot.bin
            u-boot/u-boot-dtb.bin
          if-no-files-found: warn
