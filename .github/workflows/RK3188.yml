name: Build U-Boot for RK3188

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin repository
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Build U-Boot for RK3188
        run: |
          cd u-boot
          # 设置工具链路径和前缀
          export GCC_PATH=/usr/bin
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export RKBIN_DIR=$PWD/../rkbin
          # 使用 rock 配置
          ./make.sh rock

      - name: List generated files
        run: |
          echo "Generated files in u-boot/:"
          ls -l u-boot/*.bin u-boot/*.img 2>/dev/null || echo "No files in root"
          echo "Checking rockdev/ directory:"
          ls -l u-boot/rockdev/ 2>/dev/null || echo "No rockdev directory"

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          cp u-boot/*_loader_*.bin uboot-output/ 2>/dev/null || echo "No loader bin"
          cp u-boot/uboot.img uboot-output/ 2>/dev/null || echo "No uboot.img"
          cp u-boot/trust.img uboot-output/ 2>/dev/null || echo "No trust.img"
          cp u-boot/rockdev/*.img uboot-output/ 2>/dev/null || echo "No rockdev images"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot
          path: uboot-output/
