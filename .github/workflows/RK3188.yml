name: Build Radxa RK3188 U-Boot (Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf device-tree-compiler swig python3-dev bison flex

      - name: Clone Radxa U-Boot
        run: |
          git clone https://github.com/radxa/u-boot.git -b v2017.09-rockchip u-boot
          cd u-boot
          git submodule update --init --recursive

      - name: Build U-Boot
        run: |
          cd u-boot
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          make rock_defconfig
          make -j$(nproc)
          # 尝试生成 Loader
          ls -la u-boot.bin spl/u-boot-spl.bin tpl/u-boot-tpl.bin 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radxa-uboot-binaries
          path: |
            u-boot/u-boot.bin
            u-boot/spl/u-boot-spl.bin
            u-boot/tpl/u-boot-tpl.bin
