name: Build U-Boot for RK3188 (Manual)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget \
            python3 \
            python3-pyelftools  # 用于处理 ELF

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Configure and build U-Boot
        run: |
          cd u-boot
          # 配置为 Radxa Rock (RK3188)
          make rock_defconfig CROSS_COMPILE=arm-linux-gnueabihf-
          # 编译 U-Boot (SPL + main)
          make CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc)
          # 生成 u-boot.img (Rockchip 格式)
          tools/mkimage -n rk3188 -T rksd -d spl/u-boot-spl.bin u-boot.img
          cat u-boot.bin >> u-boot.img

      - name: Create loader (using rkbin tools)
        run: |
          cd rkbin
          # 使用 rkbin 中的工具生成 loader
          ./tools/boot_merger --help || true  # 检查工具是否存在
          # 实际上，更简单的方式是用 rkdeveloptool 或直接使用已生成的 loader
          # 但我们可以手动组合：rkbin 的 bin 文件 + u-boot spl
          # 由于没有现成的 rk3188_loader, 可借助 rkbin 中的 DDR 初始化文件
          # 这里我们直接复制 u-boot 生成的 uboot.img 作为 loader（部分情况下可用）
          cp ../u-boot/u-boot.img ./rk3188_loader.bin

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          # 复制关键输出
          cp u-boot/u-boot.img uboot-output/
          cp u-boot/spl/u-boot-spl.bin uboot-output/ 2>/dev/null || true
          # 尝试从 rkbin 获取 loader 模板（如果存在）
          cp rkbin/rk3188_loader.bin uboot-output/ 2>/dev/null || echo "No loader, using uboot.img as fallback"
          # 生成 parameter.txt 示例
          cat > uboot-output/parameter.txt << EOF
          FIRMWARE_VER:1.0.0
          MACHINE_MODEL:rk3188
          MACHINE_ID:007
          MANUFACTURER: Rockchip
          MAGIC: 0x5041524B
          ATAG: 0x60000800
          MACHINE: 3188
          CHECK_MASK: 0x80
          PWR_HLD: 0,0,A,0,1
          CMDLINE:console=ttyFIQ0,115200 earlyprintk root=/dev/mmcblk0p2 rootfstype=ext4 rootwait
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-manual
          path: uboot-output/
