name: Build RK3188 U-Boot for RKDevTool

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            swig python3-dev \
            bison flex

      - name: Clone Rockchip U-Boot
        run: |
          git clone https://github.com/rockchip-linux/u-boot.git u-boot
          cd u-boot
          git submodule update --init --recursive

      - name: Setup DTS and Config
        run: |
          cd u-boot
          cp "$GITHUB_WORKSPACE/rk3188-sangfor-adesk.dts" arch/arm/dts/rk3188-sangfor-adesk.dts
          echo "" >> arch/arm/dts/Makefile
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-sangfor-adesk.dtb" >> arch/arm/dts/Makefile
          if [ ! -f configs/rk3188_defconfig ]; then
            cp configs/rock_defconfig configs/rk3188_defconfig
          fi
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE="rk3188-radxarock"/CONFIG_DEFAULT_DEVICE_TREE="rk3188-sangfor-adesk"/g' configs/rk3188_defconfig

      - name: Build U-Boot
        run: |
          cd u-boot
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          make clean
          make rk3188_defconfig

          # 精简配置
          sed -i 's/^CONFIG_SPL_PINCTRL=y/# CONFIG_SPL_PINCTRL is not set/g' .config
          sed -i 's/^CONFIG_SPL_OF_PLATDATA=y/# CONFIG_SPL_OF_PLATDATA is not set/g' .config
          sed -i 's/^CONFIG_TPL=y/# CONFIG_TPL is not set/g' .config
          sed -i 's/^CONFIG_TPL_OF_PLATDATA=y/# CONFIG_TPL_OF_PLATDATA is not set/g' .config
          sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/g' .config
          # 清空 serial_rockchip.c 引用
          echo "/* dummy file */" > drivers/serial/serial_rockchip.c

          # 设置 SPL 大小限制为 0（禁用检查）
          sed -i 's/^CONFIG_SPL_SIZE_LIMIT=.*/CONFIG_SPL_SIZE_LIMIT=0x0/g' .config

          # 删除 Makefile.spl 中 RK3188 的大小限制计算（关键）
          sed -i '/CONFIG_SPL_SIZE_LIMIT = 0x8000 - 0x800/d' scripts/Makefile.spl
          sed -i '/CONFIG_SPL_SIZE_LIMIT = 0x8000 - 0x800/d' scripts/Makefile.spl

          make olddefconfig

          # 编译并强制禁用 SPL 大小检查（双重保险）
          make -j$(nproc) SPL_SIZE_LIMIT=0

          echo "================ 检查产物 ================"
          ls -la spl/u-boot-spl.bin u-boot.bin 2>/dev/null || echo "SPL 或 u-boot.bin 未生成"

          # 尝试打包 uboot.img
          if [ -f tools/boot_merger ]; then
            printf '%s\n' \
              '[CHIP_NAME]' \
              'NAME=RK3188' \
              '[VERSION]' \
              'MAJOR=2' \
              'MINOR=3' \
              '[CODE471_OPTION]' \
              'NUM=1' \
              'Path1=u-boot-dtb.bin' \
              'Sleep=0' \
              '[CODE472_OPTION]' \
              'NUM=1' \
              'Path1=u-boot-dtb.bin' \
              'Sleep=0' \
              '[LOADER_OPTION]' \
              'NUM=2' \
              'LOADER1=u-boot-spl.bin' \
              'LOADER2=u-boot.bin' \
              'FlashData=0x60000000' \
              'FlashBoot=0x60000000' \
              '[OUTPUT]' \
              'NAME=uboot.img' > /tmp/RK3188MINIALL.ini
            ./tools/boot_merger /tmp/RK3188MINIALL.ini
          else
            echo "boot_merger not found, skip uboot.img"
          fi

          ls -la uboot.img u-boot.bin spl/u-boot-spl.bin 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-package
          path: |
            u-boot/uboot.img
            u-boot/u-boot.bin
            u-boot/spl/u-boot-spl.bin
          if-no-files-found: warn
