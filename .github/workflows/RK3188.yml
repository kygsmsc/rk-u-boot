name: Build U-Boot for RK3188 (with GCC 7)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies and GCC 7 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-7-arm-linux-gnueabihf \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget \
            python3 \
            python3-pyelftools
          # 将默认的 arm-linux-gnueabihf-gcc 指向 gcc-7
          sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-7 /usr/bin/arm-linux-gnueabihf-gcc
          sudo ln -sf /usr/bin/arm-linux-gnueabihf-g++-7 /usr/bin/arm-linux-gnueabihf-g++ 2>/dev/null || true

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin (optional)
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Configure and build U-Boot
        run: |
          cd u-boot
          # 配置
          make rock_defconfig CROSS_COMPILE=arm-linux-gnueabihf-
          # 可选：强制设为 ARMv7（但 GCC 7 也能处理 ARMv5，所以可省略）
          sed -i 's/CONFIG_ARM_ARCH=5/CONFIG_ARM_ARCH=7/' .config
          echo "CONFIG_CPU_V7=y" >> .config
          # 编译（禁用 -Werror 以防警告被当作错误）
          make CROSS_COMPILE=arm-linux-gnueabihf- \
               KCFLAGS="-Wno-error" \
               KBUILD_CFLAGS="-Wno-error" \
               -j$(nproc)
          # 打包成 Rockchip 格式
          tools/mkimage -n rk3188 -T rksd -d spl/u-boot-spl.bin u-boot.img
          cat u-boot.bin >> u-boot.img

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          cp u-boot/u-boot.img uboot-output/
          cp u-boot/spl/u-boot-spl.bin uboot-output/ 2>/dev/null || true
          cp u-boot/u-boot.bin uboot-output/ 2>/dev/null || true
          # parameter.txt 示例
          cat > uboot-output/parameter.txt << EOF
          FIRMWARE_VER:1.0.0
          MACHINE_MODEL:rk3188
          MACHINE_ID:007
          MANUFACTURER: Rockchip
          MAGIC: 0x5041524B
          ATAG: 0x60000800
          MACHINE: 3188
          CHECK_MASK: 0x80
          PWR_HLD: 0,0,A,0,1
          CMDLINE:console=ttyFIQ0,115200 earlyprintk root=/dev/mmcblk0p2 rootfstype=ext4 rootwait
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-gcc7
          path: uboot-output/
