name: Build U-Boot for RK3188 (with Linaro GCC 7.5)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-uboot:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies (excluding gcc-7)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            u-boot-tools \
            cpio \
            git \
            wget \
            xz-utils \
            python3 \
            python3-pyelftools

      - name: Download and setup Linaro GCC 7.5 toolchain
        run: |
          # 下载 Linaro 7.5.0 2019.12 (支持 armv5)
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabihf/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabihf.tar.xz
          # 解压到当前目录
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabihf.tar.xz
          # 将 bin 目录添加到 PATH
          echo "$PWD/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabihf/bin" >> $GITHUB_PATH
          # 设置环境变量供后续步骤使用
          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV

      - name: Clone Rockchip U-Boot
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/u-boot.git

      - name: Clone rkbin (optional, for reference)
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Configure and build U-Boot
        run: |
          cd u-boot
          # 配置
          make rock_defconfig CROSS_COMPILE=arm-linux-gnueabihf-
          # 修改架构为 ARMv7 (Cortex-A9) 以获得更好性能，但 GCC 7 也能处理 ARMv5
          sed -i 's/CONFIG_ARM_ARCH=5/CONFIG_ARM_ARCH=7/' .config
          echo "CONFIG_CPU_V7=y" >> .config
          # 编译
          make CROSS_COMPILE=arm-linux-gnueabihf- \
               KCFLAGS="-Wno-error" \
               KBUILD_CFLAGS="-Wno-error" \
               -j$(nproc)
          # 打包为 Rockchip 格式 (uboot.img)
          tools/mkimage -n rk3188 -T rksd -d spl/u-boot-spl.bin u-boot.img
          cat u-boot.bin >> u-boot.img

      - name: Prepare artifacts
        run: |
          mkdir -p uboot-output
          cp u-boot/u-boot.img uboot-output/
          cp u-boot/spl/u-boot-spl.bin uboot-output/ 2>/dev/null || true
          cp u-boot/u-boot.bin uboot-output/ 2>/dev/null || true
          cat > uboot-output/parameter.txt << EOF
          FIRMWARE_VER:1.0.0
          MACHINE_MODEL:rk3188
          MACHINE_ID:007
          MANUFACTURER: Rockchip
          MAGIC: 0x5041524B
          ATAG: 0x60000800
          MACHINE: 3188
          CHECK_MASK: 0x80
          PWR_HLD: 0,0,A,0,1
          CMDLINE:console=ttyFIQ0,115200 earlyprintk root=/dev/mmcblk0p2 rootfstype=ext4 rootwait
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-uboot-linaro
          path: uboot-output/
