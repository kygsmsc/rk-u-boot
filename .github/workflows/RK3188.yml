name: Build U-Boot for RK3188 (SPL only, no TPL)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout U-Boot Source
        uses: actions/checkout@v4
        with:
          repository: rockchip-linux/u-boot
          ref: master
          submodules: recursive
          clean: true

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf device-tree-compiler swig python3-dev bison flex

      - name: Customize DTS
        run: |
          cat > arch/arm/dts/rk3188-sangfor-adesk.dts << 'EOF'
          /dts-v1/;
          #include "rk3188.dtsi"

          / {
              model = "Sangfor aDesk VDI (RK3188-PX3)";
              compatible = "sangfor,adesk-vdi", "rockchip,rk3188";

              chosen {
                  stdout-path = "serial0:115200n8";
                  bootargs = "console=ttyFIQ0,115200n8 root=/dev/mmcblk0p2 rootfstype=ext4 rootwait";
              };

              memory@60000000 {
                  device_type = "memory";
                  reg = <0x60000000 0x40000000>;
              };

              aliases { serial0 = &uart0; mmc0 = &emmc; };

              vcc_sys: vsys-regulator {
                  compatible = "regulator-fixed";
                  regulator-name = "vcc_sys";
                  regulator-min-microvolt = <5000000>;
                  regulator-max-microvolt = <5000000>;
                  regulator-always-on;
                  regulator-boot-on;
                  u-boot,dm-pre-reloc;
              };

              vcc_io: vcc-io-regulator {
                  compatible = "regulator-fixed";
                  regulator-name = "vcc_io";
                  regulator-min-microvolt = <3300000>;
                  regulator-max-microvolt = <3300000>;
                  regulator-always-on;
                  regulator-boot-on;
                  u-boot,dm-pre-reloc;
                  vin-supply = <&vcc_sys>;
              };

              vccq_emmc: emmc-vccq-regulator {
                  compatible = "regulator-fixed";
                  regulator-name = "vccq_emmc";
                  regulator-min-microvolt = <1800000>;
                  regulator-max-microvolt = <1800000>;
                  u-boot,dm-pre-reloc;
                  vin-supply = <&vcc_sys>;
              };
          };

          &uart0 { status = "okay"; u-boot,dm-pre-reloc; pinctrl-0 = <&uart0_xfer>; pinctrl-names = "default"; };
          &emmc { status = "okay"; u-boot,dm-pre-reloc; bus-width = <8>; cap-mmc-highspeed; non-removable; vmmc-supply = <&vcc_io>; vqmmc-supply = <&vccq_emmc>; };

          &i2c1 {
              status = "okay"; clock-frequency = <400000>; u-boot,dm-pre-reloc; pinctrl-0 = <&i2c1_xfer>; pinctrl-names = "default";
              rk808: pmic@1b {
                  compatible = "rockchip,rk808"; reg = <0x1b>; interrupt-parent = <&gpio0>; interrupts = <RK_PB3 IRQ_TYPE_LEVEL_LOW>;
                  u-boot,dm-pre-reloc; rockchip,system-power-controller; wakeup-source;
                  regulators {
                      vdd_cpu: DCDC_REG1 { regulator-name = "vdd_cpu"; regulator-min-microvolt = <750000>; regulator-max-microvolt = <1350000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vdd_core: DCDC_REG2 { regulator-name = "vdd_core"; regulator-min-microvolt = <850000>; regulator-max-microvolt = <1250000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vcc_ddr: DCDC_REG3 { regulator-name = "vcc_ddr"; regulator-min-microvolt = <1200000>; regulator-max-microvolt = <1200000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      DCDC_REG4 { regulator-name = "vcc_io"; regulator-min-microvolt = <3300000>; regulator-max-microvolt = <3300000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vcc_lan: LDO_REG1 { regulator-name = "vcc_lan"; regulator-min-microvolt = <3300000>; regulator-max-microvolt = <3300000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                      vdd_10: LDO_REG3 { regulator-name = "vdd_10"; regulator-min-microvolt = <1000000>; regulator-max-microvolt = <1000000>; regulator-always-on; regulator-boot-on; u-boot,dm-pre-reloc; };
                  };
              };
              hym8563: rtc@51 {
                  compatible = "haoyu,hym8563"; reg = <0x51>; interrupt-parent = <&gpio0>; interrupts = <RK_PB5 IRQ_TYPE_EDGE_FALLING>;
                  u-boot,dm-pre-reloc; #clock-cells = <0>; wakeup-source;
              };
          };
          EOF

          # 追加 DTS 目标
          echo "" >> arch/arm/dts/Makefile
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-sangfor-adesk.dtb" >> arch/arm/dts/Makefile
          
          # 修改默认 DTB
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE="rk3188-radxarock"/CONFIG_DEFAULT_DEVICE_TREE="rk3188-sangfor-adesk"/g' configs/rock_defconfig 2>/dev/null || true

      - name: Build U-Boot (SPL only, skip dtoc)
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          # 清理并配置
          make clean
          make rock_defconfig
          
          # 修复 -march 架构参数
          sed -i 's/-march=armv5/-march=armv7-a/g' arch/arm/Makefile
          sed -i 's/-march=armv5/-march=armv7-a/g' Makefile
          
          # 强制禁用 TPL 和 SPL_OF_PLATDATA（跳过 Python2 的 dtoc 工具）
          sed -i 's/^CONFIG_TPL=y/# CONFIG_TPL is not set/g' .config
          sed -i 's/^CONFIG_SPL_OF_PLATDATA=y/# CONFIG_SPL_OF_PLATDATA is not set/g' .config
          grep -q "CONFIG_SPL_OF_PLATDATA" .config || echo "# CONFIG_SPL_OF_PLATDATA is not set" >> .config
          # 确保 CONFIG_SPL 开启
          sed -i 's/# CONFIG_SPL is not set/CONFIG_SPL=y/g' .config
          grep -q "CONFIG_SPL" .config || echo "CONFIG_SPL=y" >> .config
          
          # 配置 ARMv7 和禁用 Thumb
          sed -i 's/CONFIG_SYS_THUMB_BUILD=y/# CONFIG_SYS_THUMB_BUILD is not set/g' .config
          sed -i 's/# CONFIG_CPU_V7 is not set/CONFIG_CPU_V7=y/g' .config
          grep -q "CONFIG_CPU_V7" .config || echo "CONFIG_CPU_V7=y" >> .config
          sed -i 's/CONFIG_SYS_ARM_ARCH=5/CONFIG_SYS_ARM_ARCH=7/g' .config
          
          make olddefconfig
          
          # 只编译 SPL 和 U-Boot 主体，跳过 TPL 和 dtoc
          make -j$(nproc) spl/u-boot-spl.bin u-boot.bin
          
          # 列出产物
          ls -la spl/u-boot-spl.bin u-boot.bin u-boot-rockchip.bin 2>/dev/null || true
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-sangfor-uboot-spl-binaries
          path: |
            u-boot.bin
            spl/u-boot-spl.bin
            u-boot-rockchip.bin
          if-no-files-found: warn
